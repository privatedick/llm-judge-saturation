name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests (offline, no API key needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r python/requirements.txt
      - name: Run tests
        run: python -m pytest python/ -v

  lean-build:
    name: Lean build (0 sorry / 0 repo-declared axiom)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      # `lake build` here also runs the `AxiomAudit` default target, which is the
      # real sorry/axiom gate: it walks every declaration this repo's modules
      # contribute and fails if any depends on an axiom outside Lean's standard
      # three. That catches `sorryAx` in any syntactic position and any `axiom`
      # command added to the repo.
      #
      # It replaces a line-anchored `grep -rnP '^\s*sorry\b'` that used to stand
      # here and called itself "the real gate". It was not one: `exact sorry`
      # sits on a line starting with `exact`, so the grep found nothing while
      # `#print axioms` reported `sorryAx`. Both halves were demonstrated before
      # this step was rewritten.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      # Independent of the axiom footprint: replay the built environment through
      # the kernel, catching anything that got into the environment without
      # passing it (unsafe/metaprogramming routes, corrupt oleans).
      #
      # Deliberately invoked directly rather than via lean-action's `leanchecker:
      # true` input. That input runs bare `lake env leanchecker`, which derives
      # the module to check from the *package* name -- here `llmJudgeSaturation`,
      # capitalized to `LlmJudgeSaturation`, which is not a module, so it exits 1
      # with "Could not find any oleans for". Naming the library modules
      # explicitly is the same tool without that failure.
      #
      # Note leanchecker is NOT a sorry check: it exits 0 on `sorryAx`, since
      # that is a legitimate axiom to the kernel. AxiomAudit above is what makes
      # the 0-sorry claim; this checks a different property.
      - name: Replay environment through the kernel (leanchecker)
        run: lake env leanchecker EvoEcos AxiomAudit
